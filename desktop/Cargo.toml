[package]
name = "soundcloud-desktop"
version = "1.3.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
mime_guess = "2.0.5"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
